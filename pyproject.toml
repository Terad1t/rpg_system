[project]
name = "rpg-system"
version = "1.1.0"
description = "Plataforma para mestres e jogadores de RPG de mesa: fichas, inventário, lutas por turno e chat em tempo real."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "sqlalchemy>=2.0.48",
    "alembic>=1.11.1",
    "passlib>=1.7.4",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]
dev = [
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # passlib usa o módulo `crypt`, removido no Python 3.13; não afeta pbkdf2_sha256.
    "ignore::DeprecationWarning:passlib.*",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() em valores padrão é o padrão do FastAPI
